name: Publish Gradle Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release version
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$PLUGIN_VERSION" ] || echo "$PLUGIN_VERSION" | grep -qi snapshot; then
            echo "A non-SNAPSHOT version is required" >&2
            exit 1
          fi

      - name: Test and validate plugin
        run: ./gradlew clean test validatePlugins build -PpluginVersion="${{ inputs.version }}"

      - name: Publish to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins -PpluginVersion="${{ inputs.version }}"